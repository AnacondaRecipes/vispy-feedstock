{% set name = "vispy" %}
{% set version = "0.16.0" %}

package:
  name: vispy
  version: {{ version }}

source:
  fn: vispy-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 09e17744a9a7ec20233ed00ff21eb3f187a47720c4775c9b2fd5598ce6d1b5a9
  patches:
    - ctypes_fontconfig.diff

build:
  number: 0
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  build:
    - {{ compiler('c') }}
    - patch  # [not win]
    - m2-patch  # [win]
  host:
    - pip
    - python
    - setuptools >=69.4.0
    - setuptools_scm >=7.1
    - numpy >=2.0.0
    - fontconfig  # [unix]
    - cython >=3.0.0
    - packaging
    - setuptools-scm >=8.1
  run:
    - python
    - numpy
    - fontconfig  # [unix]
    - freetype-py
    - hsluv
    - kiwisolver
    - packaging
    - {{ pin_compatible('numpy') }}
  run_constrained:
    - pyglet >=1.2

test:
  imports:
    - vispy
    # make sure that platform-specific dpi functions can be imported
    - vispy.util.dpi
    - vispy.util.fonts
  requires:
    - pip
  # Only needed for the local UI testing.
  #  - pyqt
  #  - pytest
  commands:
    - pip check
    # Run the test suite, but requires a display. This is not possible in CI.
    # - python -c "import vispy; print(vispy.sys_info()); vispy.test()"

about:
  home: https://vispy.org/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: High performance interactive 2D/3D data visualization.
  description: |
    VisPy is a Python library for interactive scientific visualization that is
    designed to be fast, scalable, and easy to use.
  doc_url: https://vispy.org/overview.html
  dev_url: https://github.com/vispy/vispy

extra:
  recipe-maintainers:
    - davidh-ssec
    - kmuehlbauer
  skip-lints:
    - missing_doc_source_url
    - missing_license_url
